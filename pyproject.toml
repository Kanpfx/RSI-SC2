[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sc2rsi"
version = "0.1.0"
description = "SC2 rule-bot evolution experiments"
readme = "README.md"
requires-python = "==3.12.*"
dependencies = [
    "burnysc2==7.3.0",
    "numpy==2.0.2",
    "openhands-sdk==1.41.0",
    "openhands-tools==1.41.0",
    # SDK 1.41 imports acp.helpers, which ACP 1.x removed.
    "agent-client-protocol==0.12.1",
    "python-dotenv==1.2.2",
]

[tool.setuptools.packages.find]
include = ["bot*", "rsi*", "runtime*", "knowledge*"]
exclude = ["runtime.matches.local-play-bootstrap*"]

[tool.setuptools.package-data]
rsi = ["config.json"]
runtime = ["setup-docker.ps1"]
knowledge = ["*.md", "*.json"]
